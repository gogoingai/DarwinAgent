name: conversation_memory
description: >-
  从有日期和说话人的语料中抽取可追溯的记忆图，回答事实、时间、集合和关系问题。
  区分已经发生、计划、假设和否定；保持主体和时间精度。不能得到语料支持时语义拒答。
source_kinds: [message_text, observation, event_summary]
metadata_keys: [speaker, date, reliability]
parameter_contract: {type: object, properties: {}}
answer_format: text
answer_contract: {type: string}
