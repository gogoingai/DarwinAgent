entity_types:
  attraction:
    primary_key: [name, city]
    attributes:
      - {name: name, dtype: string}
      - {name: city, dtype: string}
      - {name: address, dtype: string}
      - {name: phone, dtype: string}
      - {name: website, dtype: string}
      - {name: latitude, dtype: float}
      - {name: longitude, dtype: float}
    description: A tourist attraction listed in the per-request attractions reference table.
  restaurant:
    primary_key: [name, city, cuisines]
    attributes:
      - {name: name, dtype: string}
      - {name: city, dtype: string}
      - {name: cuisines, dtype: string}
      - {name: average_cost, dtype: float}
      - {name: aggregate_rating, dtype: float}
    description: A dining option from the restaurants reference table.
  accommodation:
    primary_key: [name, city]
    attributes:
      - {name: name, dtype: string}
      - {name: city, dtype: string}
      - {name: room_type, dtype: string}
      - {name: price, dtype: float}
      - {name: house_rules, dtype: string}
      - {name: minimum_nights, dtype: float}
      - {name: maximum_occupancy, dtype: int}
      - {name: review_rate_number, dtype: float}
    description: A lodging option from the accommodations reference table.
  flight:
    primary_key: [flight_number, flight_date]
    attributes:
      - {name: flight_number, dtype: string}
      - {name: price, dtype: float}
      - {name: dep_time, dtype: string}
      - {name: arr_time, dtype: string}
      - {name: elapsed_time, dtype: string}
      - {name: flight_date, dtype: string}
      - {name: origin_city, dtype: string}
      - {name: dest_city, dtype: string}
      - {name: distance, dtype: float}
    description: A scheduled flight row from the flights reference table.
  city:
    primary_key: [city]
    attributes:
      - {name: city, dtype: string}
      - {name: state, dtype: string}
    description: A city declared in the allowed environment city set.
relation_types:
  located_in:
    domain: attraction
    range: city
    axioms:
      - domain_attr city equals range key city
  serves_city:
    domain: restaurant
    range: city
    axioms:
      - domain_attr city equals range key city
  lodges_in:
    domain: accommodation
    range: city
    axioms:
      - domain_attr city equals range key city
  flies_from:
    domain: flight
    range: city
    axioms:
      - domain_attr origin_city equals range key city
  flies_to:
    domain: flight
    range: city
    axioms:
      - domain_attr dest_city equals range key city
