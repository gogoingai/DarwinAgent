name: Offline framework checks
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group test --python 3.13
      - run: uv run --frozen --group test ruff check src tests datasets examples scripts/check_installed.py
      - run: uv run --frozen --group test ruff format --check src tests datasets examples scripts/check_installed.py
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group test --python ${{ matrix.python }}
      - run: uv run --frozen --group test python -m unittest discover -s tests -v
      - run: uv run --frozen --group test python -m unittest discover -s datasets/locomo/tests -v
      - run: uv run --frozen --group test python -m unittest discover -s datasets/travelplanner/tests -v
      - run: uv build --wheel
      - run: |
          uv venv /tmp/darwinagent-wheel --python ${{ matrix.python }}
          uv pip install --python /tmp/darwinagent-wheel/bin/python dist/*.whl
          /tmp/darwinagent-wheel/bin/python scripts/check_installed.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group test --python 3.13
      - run: uv run --frozen --group test python -m unittest tests.portability.test_cli tests.portability.test_dependencies -v
      - run: uv build --wheel
      - run: |
          uv venv /tmp/darwinagent-wheel --python 3.13
          uv pip install --python /tmp/darwinagent-wheel/bin/python dist/*.whl
          /tmp/darwinagent-wheel/bin/python scripts/check_installed.py
