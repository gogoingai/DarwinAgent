[project]
name = "oak-repro"
version = "0.3.2"
description = "Fixed agent pipeline with bounded S/F/C/P asset capabilities"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "networkx>=3.6.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
formal = ["owlready2>=0.46"]
benchmarks = [
    "pandas>=2.1",
    "numpy>=1.26",
    "datasets>=2.20",
    "tqdm>=4.66",
    "rich>=13.0",
    "gradio>=6.0.0",
    "requests>=2.31",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oak"]
