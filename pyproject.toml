[project]
name = "darwinagent"
version = "0.1.0"
description = "Evolution for the Agent Era: experience-driven recursive self-improvement for agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "networkx>=3.6.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/gogoingai/DarwinAgent"
Documentation = "https://github.com/gogoingai/DarwinAgent#readme"
Issues = "https://github.com/gogoingai/DarwinAgent/issues"

[project.scripts]
darwinagent = "darwinagent.cli:main"

[project.optional-dependencies]
vector = ["numpy>=1.26", "requests>=2.31"]
formal = ["owlready2>=0.46"]
benchmarks = [
    "pandas>=2.1",
    "numpy>=1.26",
    "datasets>=2.20",
    "tqdm>=4.66",
    "rich>=13.0",
    "gradio>=6.0.0",
    "requests>=2.31",
]

[dependency-groups]
test = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31", "ruff==0.16.10"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
preview = false
force-exclude = true
include = ["src/**/*.py", "tests/**/*.py", "datasets/**/*.py", "examples/**/*.py", "scripts/check_installed.py"]
extend-exclude = [
    "src/darwinagent/demo/device_maintenance/assets",
    "tests/fixtures",
    "tasks",
    "datasets/*/scripts",
    "datasets/locomo/data",
    "datasets/travelplanner/data",
    "datasets/*/runs",
    "datasets/*/snapshots",
    "docs/diagnostics",
    "docs/history",
    "mem0",
    "third_party",
    "oak",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B006", "B023", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darwinagent"]
